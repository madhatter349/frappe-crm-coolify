# Frappe CRM — production stack for Coolify (docker compose build pack).
#
# Upstream reference: frappe/frappe_docker `compose.yaml` plus
# `overrides/compose.mariadb.yaml` and `overrides/compose.redis.yaml`, and the
# official `ghcr.io/frappe/crm` image that frappe/crm publishes from
# images/layered/Containerfile (Frappe Framework v15 + the crm app).
#
# Differences from the upstream single-server recipe, and why:
#   * The Traefik/Let's Encrypt override is dropped. Coolify owns the edge:
#     it injects the router from the app domain and terminates TLS itself.
#   * No host port is published. `frontend` exposes 8080 on the app network
#     only; Coolify's Traefik reaches it there.
#   * `init-site` creates the site (and installs the crm app) if it is missing,
#     then exits. It is idempotent, so every redeploy is safe.
#   * `backup` runs `bench backup --with-files` daily inside the stack and
#     prunes backups older than the retention window. No docker socket.
#
# Everything secret arrives via app environment variables in Coolify — nothing
# in this file is a credential.

name: frappe-crm

x-frappe-image: &frappe_image
  image: ${CUSTOM_IMAGE:-frappe-crm}:${CUSTOM_TAG:-1.92.0}
  restart: unless-stopped
  platform: linux/amd64
  # Built on the Coolify host by scripts/build-image.sh: the published
  # ghcr.io/frappe/crm image no longer contains the crm app (upstream build
  # passes APPS_JSON_BASE64 to a Containerfile that now needs a secret mount).
  # Nothing to pull: the tag exists locally before the first deploy.
  pull_policy: ${PULL_POLICY:-never}

x-frappe-sites: &frappe_sites
  - sites:/home/frappe/frappe-bench/sites

x-db-ready: &db_ready
  db:
    condition: service_healthy

x-configurator-done: &configurator_done
  configurator:
    condition: service_completed_successfully

x-init-site-done: &init_site_done
  init-site:
    condition: service_completed_successfully

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-snapshot-isolation=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10

  redis-cache:
    image: redis:8.6-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:8.6-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

  # Writes the bench-global config (DB, Redis, socketio port) into the sites
  # volume. Runs to completion before anything else starts; safe on redeploy.
  configurator:
    <<: *frappe_image
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt &&
        bench set-config -g db_host db &&
        bench set-config -gp db_port 3306 &&
        bench set-config -g redis_cache redis://redis-cache:6379 &&
        bench set-config -g redis_queue redis://redis-queue:6379 &&
        bench set-config -g redis_socketio redis://redis-queue:6379 &&
        bench set-config -gp socketio_port 9000 &&
        bench set-config -g chromium_path /usr/lib/chromium/chromium-headless-shell
    # One-shot bootstrap: exit 0 on success. `restart: "no"` is also how
    # Coolify recognises the service as not part of the app's health status.
    restart: "no"
    volumes: *frappe_sites
    depends_on:
      <<: *db_ready
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  # One-shot bootstrap: creates the site and installs the crm app the first
  # time, then exits 0 on every later deploy. The admin password only ever
  # exists as an environment variable.
  init-site:
    <<: *frappe_image
    entrypoint: ["bash", "-c"]
    # One command per line: a folded YAML line break inside `bench new-site`
    # would split the flags off the command and bench would prompt for the root
    # password instead of taking --db-root-password.
    command:
      - |
        set -e
        [ -n "$$DB_PASSWORD" ] || { echo "DB_PASSWORD is empty"; exit 1; }
        if bench --site "$$SITE_NAME" list-apps 2>/dev/null | grep -qE "^crm[[:space:]]"; then
          echo "site $$SITE_NAME already has crm - nothing to do"
        else
          echo "bootstrapping site $$SITE_NAME"
          bench drop-site "$$SITE_NAME" --db-root-password "$$DB_PASSWORD" --no-backup --force >/dev/null 2>&1 || true
          rm -rf "sites/$$SITE_NAME"
          bench new-site "$$SITE_NAME" --db-type mariadb --db-host db --db-port 3306 --mariadb-user-host-login-scope=% --db-root-password "$$DB_PASSWORD" --admin-password "$$ADMIN_PASSWORD" --install-app crm --set-default
        fi
    environment:
      SITE_NAME: ${SITE_NAME:?SITE_NAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
    # One-shot bootstrap: exit 0 on success. `restart: "no"` is also how
    # Coolify recognises the service as not part of the app's health status.
    restart: "no"
    volumes: *frappe_sites
    depends_on:
      <<: [*db_ready, *configurator_done]

  backend:
    <<: *frappe_image
    environment:
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    restart: unless-stopped
    volumes: *frappe_sites
    depends_on:
      <<: [*db_ready, *configurator_done, *init_site_done]
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  # The only service Coolify routes to. 8080 stays on the app network.
  frontend:
    <<: *frappe_image
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      NGINX_LISTEN_PORT: "8080"
      # Literal hostname, not $host: single-site stack, and Coolify's compose
      # env parser rejects a value that starts with "$" (it tries to treat the
      # value as a variable reference key).
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:?SITE_NAME is required}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: "50m"
    restart: unless-stopped
    volumes: *frappe_sites
    expose:
      - "8080"
    depends_on:
      backend:
        condition: service_started
      websocket:
        condition: service_started

  websocket:
    <<: *frappe_image
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    restart: unless-stopped
    volumes: *frappe_sites
    depends_on:
      <<: [*db_ready, *configurator_done, *init_site_done]
      redis-queue:
        condition: service_started

  queue-short:
    <<: *frappe_image
    command: ["bench", "worker", "--queue", "short,default"]
    restart: unless-stopped
    volumes: *frappe_sites
    depends_on:
      <<: [*db_ready, *configurator_done, *init_site_done]

  queue-long:
    <<: *frappe_image
    command: ["bench", "worker", "--queue", "long,default,short"]
    restart: unless-stopped
    volumes: *frappe_sites
    depends_on:
      <<: [*db_ready, *configurator_done, *init_site_done]

  # Ticks the Frappe scheduler every 60s. `bench schedule` runs the same
  # enqueue loop in-process, but in this stack its loop stopped enqueueing
  # while still holding its file lock (observed 2026-11-04), leaving email
  # pulls and the outgoing queue stalled with no log line. One short-lived
  # process per tick is deterministic and each tick is visible in the logs.
  scheduler:
    <<: *frappe_image
    entrypoint: ["bash", "-c"]
    command:
      - |
        while true; do
          bench --site "$$SITE_NAME" execute frappe.utils.scheduler.enqueue_events --args "[\"$$SITE_NAME\"]" || echo "scheduler tick failed at $$(date -Is)"
          sleep 60
        done
    environment:
      SITE_NAME: ${SITE_NAME:?SITE_NAME is required}
    restart: unless-stopped
    volumes: *frappe_sites
    depends_on:
      <<: [*db_ready, *configurator_done, *init_site_done]

  # Daily logical backup (database + uploaded files) inside the sites volume,
  # which is itself included in the host's nightly restic snapshot to B2. No
  # docker socket, no credentials.
  backup:
    <<: *frappe_image
    entrypoint: ["bash", "-c"]
    command:
      - >
        set -u;
        sleep 900;
        while true; do
          if bench --site "$$SITE_NAME" backup --with-files; then
            echo "backup ok $$(date -Is)";
          else
            echo "backup FAILED $$(date -Is)";
          fi;
          find sites -path '*/private/backups/*' -type f -mtime +"$$BACKUP_KEEP_DAYS" -delete 2>/dev/null || true;
          sleep "$$BACKUP_INTERVAL_SECONDS";
        done
    environment:
      SITE_NAME: ${SITE_NAME:?SITE_NAME is required}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    restart: unless-stopped
    volumes: *frappe_sites
    depends_on:
      <<: [*db_ready, *configurator_done, *init_site_done]

volumes:
  sites:
  db-data:
  redis-queue-data:
